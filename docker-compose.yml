version: '3.8'

services:
  temporal:
    image: temporalio/admin-tools:latest
    container_name: ghost-hunter-temporal
    command: ["temporal", "server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db", "--port", "7233", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"
    volumes:
      - temporal_data:/data
    restart: unless-stopped

volumes:
  temporal_data:
